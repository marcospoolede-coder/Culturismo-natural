        var l = LOGROS.filter(function(x){ return x.id === id; })[0];

      }).join("") + '</div>' : "") +

      ' series apuntadas, ' + (10 + nApuntes + (extra.meta ? 25 : 0)) + ' puntos.</p>' : '') +

  var ok = el.querySelector("#fel-ok");

  function cierra(){ el.remove(); document.removeEventListener("keydown", tecla); }
  function tecla(ev){ if(ev.key === "Escape") cierra(); }
  ok.addEventListener("click", function(){

}

/* Intención de implementación: decir ahora qué día y a qué hora será el
   siguiente entreno hace más probable que ocurra. Sale al cerrar la sesión. */
function sigHTML(){
  var hoyD = new Date(), elegido = "", botones = "";
  for(var k = 1; k <= 7; k++){
    var d = new Date(hoyD.getFullYear(), hoyD.getMonth(), hoyD.getDate() + k), di = iso(d);
    if(!elegido && diasPlan().indexOf(diaDe(d)) > -1) elegido = di;
  }
  if(!elegido) elegido = iso(new Date(hoyD.getFullYear(), hoyD.getMonth(), hoyD.getDate() + 1));
  for(var j = 1; j <= 7; j++){
    var d2 = new Date(hoyD.getFullYear(), hoyD.getMonth(), hoyD.getDate() + j), i2 = iso(d2), on = i2 === elegido;
    botones += '<button type="button" class="dia' + (on ? " on" : "") + '" data-sigd="' + i2 + '" aria-pressed="' + on + '" ' +
      'aria-label="' + NOMBREDIA[diaDe(d2)] + ' ' + d2.getDate() + '">' + LETRADIA[diaDe(d2)] + '<small>' + d2.getDate() + '</small></button>';
  }
  return '<div class="sig"><b>¿Cuándo es el siguiente?</b><div class="dias">' + botones + '</div>' +

/* ============================ ALIMENTACIÓN ============================
   Tres cosas y en este orden, que es el de la evidencia: la proteína es la
   base, la creatina es el único suplemento que compensa, y el magnesio solo
   si falta. Frases cortas y números con tu peso. */
/* ===== Alimentación con datos: lo que comes frente a lo que gastas =====
   Las comidas, el gasto (WHOOP, Apple Salud o a mano) y el peso viven en
   Supabase (nutricion.sql). La foto con IA es solo para los planes "pago"
   (API de Claude, Edge Function analiza-comida) y "propio" (la suscripción
   de Marcos, desde su Mac). El semáforo:
     verde   comes lo justo para tu objetivo
     naranja te quedas algo corto o te pasas un poco
     rojo    muy poco o demasiado
   Con tres semanas de pesos manda la báscula, porque el gasto de los relojes
   falla un 10 a 40 %. */
var nut = {cargado:false, cargando:false, falta:false, plan:"gratis", comidas:[], gasto:[], pesos:[],
           integ:{}, aviso:"", sondeo:null, ultSync:0, vista:"", dia:null, mes:null, mom:null, gdia:null};

function fISO(d){ return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function nHoy(){ return fISO(new Date()); }
function nDia(n){ return fISO(new Date(Date.now() - n * 864e5)); }
/* días que se cargan: el mes en curso y el anterior, para el calendario */
var N_HIST = 62;
/* las cajitas del día. La cajita de una comida sale de su hora, así no hace
   falta guardar nada más: `hasta` es donde acaba su franja */
var N_MOM = [
  {k:"desayuno", t:"Desayuno",     h:"08:00", hasta:"11:00"},
  {k:"media",    t:"Media mañana", h:"11:30", hasta:"13:00"},
  {k:"comida",   t:"Comida",       h:"14:30", hasta:"16:30"},
  {k:"merienda", t:"Merienda",     h:"18:00", hasta:"20:00"},
  {k:"cena",     t:"Cena",         h:"21:30", hasta:"24:00"}
];
function nMom(k){ for(var i = 0; i < N_MOM.length; i++) if(N_MOM[i].k === k) return N_MOM[i]; return N_MOM[2]; }
function nMomDeHora(h){
  if(!h || !/^\d\d:\d\d/.test(h)) return "comida";
  if(h < "05:00") return "cena";          /* de madrugada sigue siendo la cena */
  for(var i = 0; i < N_MOM.length; i++) if(h < N_MOM[i].hasta) return N_MOM[i].k;
  return "cena";
}
/* hora con la que se guarda: la de ahora si es hoy y cae en esa cajita; si no, la de referencia */
function nHoraPara(k, f){
  var ahora = nHora();
  return (f === nHoy() && nMomDeHora(ahora) === k) ? ahora : nMom(k).h;
}
/* el día que se está mirando: hoy, salvo que se toque otro en el calendario */
function nSel(){ return nut.dia || nHoy(); }
function nMil(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
function nSigno(n){ n = Math.round(n); return (n > 0 ? "+" : n < 0 ? "−" : "") + nMil(Math.abs(n)); }
function nFechaLarga(f){
  var t = new Date(f + "T12:00:00").toLocaleDateString("es-ES", {weekday:"long", day:"numeric", month:"long"});
  return t.charAt(0).toUpperCase() + t.slice(1);
}

function nCfg(){
  var c = state.nutri || {};
  return {obj: c.obj || "ganar", exp: c.exp || "1-3", sexo: c.sexo || "h",
          edad: +c.edad || 30, alt: +c.alt || 178, mant: +c.mant || 0};
}
function nPuede(){ return nut.plan === "pago" || nut.plan === "propio"; }

/* horquilla de superávit por objetivo y años entrenando (Helms 2023) */
function nBanda(){
  var c = nCfg();
  if(c.obj === "mantener") return {lo:-0.05, hi:0.05};
  if(c.obj === "perder") return {lo:-0.25, hi:-0.10};
  var b = c.exp === "<1" ? {lo:0.10, hi:0.20} : c.exp === "3+" ? {lo:0.05, hi:0.10} : {lo:0.07, hi:0.15};
  if(esDescarga(state.pos)) b = {lo:b.lo, hi:(b.lo + b.hi) / 2};
  return b;
}
/* ritmo de la báscula, en % del peso a la semana */
function nRitmo(){
  var c = nCfg();
  if(c.obj === "mantener") return {lo:-0.15, hi:0.15};
  if(c.obj === "perder") return {lo:-1, hi:-0.5};
  return c.exp === "<1" ? {lo:0.25, hi:0.5} : c.exp === "3+" ? {lo:0.1, hi:0.25} : {lo:0.25, hi:0.4};
}

/* metabolismo basal, Mifflin-St Jeor */
function nBasal(){
  var c = nCfg(), kg = pesoCorp();
  return Math.round(10 * kg + 6.25 * c.alt - 5 * c.edad + (c.sexo === "m" ? -161 : 5));
}
function nGasto(f){
  var g = nut.gasto.filter(function(x){ return x.fecha === f; });
  function de(fu){ for(var i = 0; i < g.length; i++) if(g[i].fuente === fu) return g[i]; return null; }
  var w = de("whoop"), a = de("apple"), m = de("manual");
  if(w && w.total) return {kcal:w.total, fuente:"WHOOP", parcial:w.parcial};
  if(a && a.total) return {kcal:a.total, fuente:"Apple Salud", parcial:a.parcial};
  if(a && a.activa) return {kcal:a.activa + nBasal(), fuente:"Apple Salud y tu basal", parcial:a.parcial};
  if(m && m.total) return {kcal:m.total, fuente:"a mano", parcial:false};
  var c = nCfg();
  if(c.mant) return {kcal:c.mant, fuente:"tu mantenimiento", parcial:false, fijo:true};
  /* sin pulsera: un día normal sin contar el gimnasio, más lo que cuesta
     cada entreno cerrado ese día */
  var base = Math.round(nBasal() * N_VIDA / 10) * 10, ent = nEntrenoKcal(f);
  return {kcal:base + ent, fuente:ent ? "estimado, con tu entreno" : "estimado",
          parcial:false, fijo:true, est:true, base:base, ent:ent};
}
/* basal por 1,3: vida diaria ligera, trabajo sentado y algo de paseo */
var N_VIDA = 1.3;
/* Coste de los entrenos cerrados un día. Fuerza con descansos largos: unos
   4 MET de media, 3 por encima de estar sentado, durante lo que dura la sesión */
function nEntrenoKcal(f){
  var t = 0;
  (state.hechas || []).forEach(function(s){
    if(s.iso !== f) return;
    var i = -1, min = 60;
    FASES.forEach(function(x, k){ if(i < 0 && x.n === s.f) i = k; });
    if(i >= 0){
      var lista = (RUT[FASES[i].rut] || {})[s.r];
      if(lista) min = duracion({f:i, s:Math.max(0, (s.w || 1) - 1), e:0}, lista);
    }
    t += pesoCorp() * 3 * min / 60;
  });
  return Math.round(t / 10) * 10;
}
function nComidas(f){
  return nut.comidas.filter(function(c){ return c.fecha === f; });
}
function nSuma(f){
  var s = {kcal:0, prot:0, n:0, pend:0};
  nComidas(f).forEach(function(c){
    if(c.estado === "hecha"){ s.kcal += c.kcal || 0; s.prot += c.prot || 0; s.n++; }
    else if(c.estado !== "error") s.pend++;
  });
  return s;
}
/* color de una relación comida / gasto */
function nColor(r){
  var b = nBanda(), m = 0.07, x = r - 1;
  if(x >= b.lo && x <= b.hi) return {c:"verde", t:"Comes lo justo"};
  if(x < b.lo && x >= b.lo - m) return {c:"naranja", t:"Te quedas algo corto"};
  if(x > b.hi && x <= b.hi + m) return {c:"naranja", t:"Te pasas un poco"};
  return x < b.lo ? {c:"rojo", t:"Comes muy poco"} : {c:"rojo", t:"Comes demasiado"};
}
/* pendiente del peso en kg a la semana, por mínimos cuadrados */
function nTendencia(){
  var p = nut.pesos.filter(function(x){ return x.fecha >= nDia(27); });
  if(p.length < 4) return null;
  var t0 = new Date(p[0].fecha).getTime(), span = (new Date(p[p.length - 1].fecha).getTime() - t0) / 864e5;
  if(span < 14) return null;
  var n = p.length, sx = 0, sy = 0, sxx = 0, sxy = 0;
  p.forEach(function(x){
    var d = (new Date(x.fecha).getTime() - t0) / 864e5, y = +x.kg;
    sx += d; sy += y; sxx += d * d; sxy += d * y;
  });
  var pend = (n * sxy - sx * sy) / (n * sxx - sx * sx);
  var kgSem = pend * 7, media = sy / n;
  return {kgSem:kgSem, pct:kgSem / media * 100, dias:Math.round(span), n:n};
}

/* gasto con el que se compara un día. El de hoy va a medias hasta la noche,
   así que se usa la media de los días completos de la última semana */
function nGastoRef(f){
  var g = nGasto(f);
  if(f === nHoy() && g.parcial){
    var ant = [], k;
    for(k = 1; k <= 7; k++){ var gk = nGasto(nDia(k)); if(!gk.fijo && !gk.parcial) ant.push(gk.kcal); }
    if(ant.length) return {kcal:Math.round(ant.reduce(function(x, y){ return x + y; }, 0) / ant.length),
      fuente:g.fuente + ", media de " + ant.length + " días", parcial:false, media:true, real:g.kcal, base:g.fuente};
  }
  return g;
}
/* un día entero: lo comido, lo gastado, el balance (comido menos gastado) y su color.
   Sin comidas apuntadas no hay balance ni color */
function nDiaInfo(f){
  var s = nSuma(f), g = nGastoRef(f), b = nBanda(), hoy = f === nHoy();
  var d = {f:f, s:s, g:g, hoy:hoy, bal:null, col:null, bajo:false,
           obj:{lo:Math.round(g.kcal * b.lo / 10) * 10, hi:Math.round(g.kcal * b.hi / 10) * 10}};
  if(s.n > 0 && g.kcal > 0){
    var x = s.kcal / g.kcal - 1, c = nColor(s.kcal / g.kcal).c;
    d.bal = s.kcal - g.kcal;
    d.bajo = x < b.lo;
    /* hoy, mientras falte por comer, no se juzga: el día sigue */
    if(hoy && d.bajo) d.col = {c:"curso", t:"El día sigue, aún te queda por comer"};
    else d.col = {c:c, t:c === "verde" ? "En tu objetivo"
      : c === "naranja" ? (d.bajo ? "Te quedaste algo corto" : "Te pasaste un poco")
      : (d.bajo ? "Muy por debajo de tu objetivo" : "Muy por encima de tu objetivo")};
  }
  return d;
}
function nObjTxt(o){
  if(o.lo >= 0) return "superávit de " + nMil(o.lo) + " a " + nMil(o.hi) + " kcal";
  if(o.hi <= 0) return "déficit de " + nMil(-o.hi) + " a " + nMil(-o.lo) + " kcal";
  return "quedarte entre " + nSigno(o.lo) + " y " + nSigno(o.hi) + " kcal";
}

/* todo el cálculo del semáforo y las recomendaciones */
function nAnalisis(){
  var hoy = nHoy(), b = nBanda(), kg = pesoCorp(), c = nCfg();
  var dias = [], i;
  for(i = 1; i <= 7; i++){
    var f = nDia(i), s = nSuma(f);
    if(s.n > 0){ var g = nGasto(f); dias.push({f:f, kcal:s.kcal, prot:s.prot, gasto:g.kcal}); }
  }
  var sem = null;
  if(dias.length >= 3){
    var tk = 0, tg = 0, tp = 0;
    dias.forEach(function(d){ tk += d.kcal; tg += d.gasto; tp += d.prot; });
    sem = {kcal:Math.round(tk / dias.length), gasto:Math.round(tg / dias.length),
           prot:Math.round(tp / dias.length), n:dias.length};
    sem.col = nColor(sem.kcal / sem.gasto);
  }
  var sh = nSuma(hoy), gh = nGastoRef(hoy);
  var obj = {lo:Math.round(gh.kcal * (1 + b.lo) / 10) * 10, hi:Math.round(gh.kcal * (1 + b.hi) / 10) * 10};
  var tend = nTendencia(), rit = nRitmo(), bas = null;
  if(tend){
    var pc = tend.pct, perder = c.obj === "perder";
    if(pc >= rit.lo && pc <= rit.hi) bas = {c:"verde", t:"La báscula va a buen ritmo"};
    else if(pc < rit.lo) bas = {c:pc < rit.lo - 0.15 ? "rojo" : "naranja", t:perder ? "Bajas demasiado rápido" : "La báscula no sube lo que toca"};
    else bas = {c:pc > rit.hi + 0.15 ? "rojo" : "naranja", t:perder ? "La báscula no baja lo que toca" : "Subes demasiado rápido"};
  }
  var principal = bas && tend.dias >= 20 ? {col:bas, por:"bascula"} : sem ? {col:sem.col, por:"semana"} : null;

  /* recomendaciones */
  var rec = [];
  if(principal && principal.por === "bascula"){
    if(bas.c !== "verde"){
      var mas = tend.pct < rit.lo;
      rec.push((mas ? "Súmale" : "Quítale") + " <b>150 a 200 kcal al día</b> durante dos semanas y vuelve a mirar. La báscula manda sobre el reloj. " +
        (mas ? nIdeas(175) : nRecorte(175)));
    }
  }else if(sem && sem.col.c !== "verde"){
    var falta = Math.round((sem.gasto * (1 + (b.lo + b.hi) / 2) - sem.kcal) / 10) * 10;
    if(falta > 0) rec.push("Te faltan unas <b>" + falta + " kcal al día</b> de media. " + nIdeas(falta));
    else rec.push("Te sobran unas <b>" + (-falta) + " kcal al día</b> de media. " + nRecorte(-falta));
  }

  var pMin = Math.round(kg * 1.6), protRef = sem ? sem.prot : (sh.n ? sh.prot : null);
  if(protRef !== null && protRef < pMin){
    rec.push("Proteína corta: <b>" + protRef + " g</b> de media y necesitas " + pMin + " g. Mete " +
      (pMin - protRef > 25 ? "una ración más de pollo, huevos o yogur griego al día." : "un yogur griego o un vaso de leche más."));
  }
  var grande = nComidas(hoy).filter(function(x){ return x.estado === "hecha" && x.kcal >= 900; })[0];
  if(grande) rec.push("Una comida de " + grande.kcal + " kcal da sueño un buen rato. Si después tienes que rendir en el trabajo, pasa parte a la merienda.");
  if(gh.fijo && !nut.integ.whoop && !nut.integ.apple){
    rec.push("Tu gasto es una estimación. Conecta WHOOP o Apple Salud abajo, o pon tu mantenimiento si lo sabes.");
  }
  if(!tend) rec.push("Pésate 3 o 4 mañanas por semana, en ayunas. Con tres semanas, el semáforo pasa a mirar la báscula, que es lo más fiable.");
  if(!sem) rec.push("Apunta lo que comes al menos 3 días para ver el semáforo de la semana.");

  return {hoy:sh, gh:gh, obj:obj, sem:sem, tend:tend, bas:bas, principal:principal, rec:rec};
}
function nIdeas(k){
  var ops = [[300, "un yogur griego con 40 g de avena"], [200, "un puñado de frutos secos, 30 g"],
             [130, "un vaso de leche entera"], [100, "un plátano"], [90, "una cucharada de aceite de oliva en la comida"]];
  var r = [], q = k;
  ops.forEach(function(o){ if(q >= o[0] * 0.8 && r.length < 2){ r.push(o[1] + " (~" + o[0] + " kcal)"); q -= o[0]; } });
  if(!r.length) r.push(ops[3][1] + " (~100 kcal)");
  return "Por ejemplo: " + r.join(" y ") + ". Mejor en la merienda que en la cena.";
}
function nRecorte(k){
  return k >= 250 ? "Quita la mitad del arroz o la pasta de la cena (~200 kcal) y mide el aceite con cuchara."
                  : "Mide el aceite con cuchara: cada cucharada son 90 kcal que no se ven.";
}

/* ---------- carga desde Supabase ---------- */
function nCarga(forzar){
  if(!nube || !sesionNube || !aprobado()){ nut.cargado = true; return Promise.resolve(); }
  if(nut.cargando) return Promise.resolve();
  nut.cargando = true;
  var u = sesionNube.user.id;
  return Promise.all([
    nube.rpc("mi_plan"),
    nube.from("comidas").select("*").gte("fecha", nDia(N_HIST)).order("creado", {ascending:true}),
    nube.from("gasto_diario").select("*").gte("fecha", nDia(N_HIST)),
    nube.from("peso_corporal").select("fecha,kg,fuente").gte("fecha", nDia(41)).order("fecha", {ascending:true}),
    nube.from("integraciones").select("proveedor,token,ultima_sync,detalle").eq("user_id", u)
  ]).then(function(r){
    nut.cargando = false; nut.cargado = true;
    if(r[1].error){ nut.falta = true; return; }
    nut.falta = false;
    nut.plan = (r[0] && !r[0].error && r[0].data) ? r[0].data : "gratis";
    nut.comidas = r[1].data || [];
    nut.gasto = r[2].data || [];
    nut.pesos = r[3].data || [];
    nut.integ = {};
    (r[4].data || []).forEach(function(x){ nut.integ[x.proveedor] = x; });
    nSondea();
    if(nut.integ.whoop && (forzar || Date.now() - nut.ultSync > 30 * 60000)) nSyncWhoop();
  })["catch"](function(){ nut.cargando = false; nut.cargado = true; });
}
function nPinta(){ if(tab === "com") render(); }
/* mientras haya comidas calculándose, se mira cada 8 segundos */
function nSondea(){
  clearTimeout(nut.sondeo);
  var hay = nut.comidas.some(function(c){ return c.estado === "pendiente" || c.estado === "analizando"; });
  if(!hay) return;
  nut.sondeo = setTimeout(function(){
    if(tab !== "com"){ nSondea(); return; }
    nube.from("comidas").select("*").gte("fecha", nDia(N_HIST)).order("creado", {ascending:true}).then(function(r){
      if(r.data){ nut.comidas = r.data; nPinta(); }
      nSondea();
    });
  }, 8000);
}
function nSyncWhoop(){
  nut.ultSync = Date.now();
  return nube.functions.invoke("whoop/sincroniza", {body:{}}).then(function(){
    return nube.from("gasto_diario").select("*").gte("fecha", nDia(N_HIST));
  }).then(function(r){ if(r && r.data){ nut.gasto = r.data; nPinta(); } })["catch"](function(){});
}

/* ---------- pantalla ---------- */
function nLuz(col, grande){
  return '<span class="luz ' + (grande ? "g " : "") + col + '" aria-hidden="true"><i class="r"></i><i class="n"></i><i class="v"></i></span>';
}
function nNombre(c){
  if(c.items && c.items.length) return c.items.map(function(i){ return i.nombre; }).slice(0, 3).join(", ");
  return c.descripcion || (c.origen === "foto" ? "Foto" : "Comida");
}
function nutHTML(){
  if(!nube || !sesionNube){
    return '<div class="sect"><div class="card nut"><b>Lo que comes frente a lo que gastas</b>' +
      '<p class="expl">Entra en tu cuenta, en Ajustes, para apuntar comidas y ver el semáforo. ' +
      'La guía y los suplementos los tienes arriba.</p></div></div>';
  }
  if(!aprobado()){
    return '<div class="sect"><div class="card nut"><b>Registro de comidas</b>' +
      '<p class="expl">Se activa cuando aprueben tu cuenta. Mientras, tienes la guía y los suplementos arriba.</p></div></div>';
  }
  if(!nut.cargado){ nCarga().then(nPinta); return '<div class="sect"><div class="card nut"><p class="expl" style="margin:0">Cargando tus comidas…</p></div></div>'; }
  if(nut.falta) return '<div class="sect"><div class="card nut"><b>Registro de comidas</b><p class="expl">Se está activando. Vuelve en un rato.</p></div></div>';

  var h = '<div class="sect">';
  if(nut.aviso) h += '<div class="banner" style="margin-bottom:10px"><b>Aviso</b><span>' + nut.aviso + '</span></div>';
  h += nCalHTML() + nDiaHTML() + nGastoHTML() + '</div>';

  /* la semana: el semáforo de fondo y qué hacer */
  var a = nAnalisis();
  h += '<div class="sect"><div class="eyebrow">Tu semana</div><div class="card nut">';

/* ---------- acciones ---------- */
function nHora(){ var d = new Date(); return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2); }

function nHoja(html, monta){
  var el = document.createElement("div");
  el.className = "fel";
  el.innerHTML = '<div class="fel-c info-c nhoja" role="dialog" aria-modal="true">' + html + '</div>';
  document.body.appendChild(el);
  function cierra(){ el.remove(); document.removeEventListener("keydown", tecla); }
  function tecla(ev){ if(ev.key === "Escape") cierra(); }
  el.addEventListener("click", function(ev){ if(ev.target === el || ev.target.closest("[data-cierra]")) cierra(); });
  document.addEventListener("keydown", tecla);
  if(monta) monta(el, cierra);
  return el;
}

/* reduce la foto a 1024 px: llega antes y la IA cobra menos */
function nReduce(file){
  return new Promise(function(ok, ko){
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function(){
      var m = 1024, w = img.width, h = img.height, k = Math.min(1, m / Math.max(w, h));
      var cv = document.createElement("canvas");
      cv.width = Math.round(w * k); cv.height = Math.round(h * k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(function(b){ b ? ok(b) : ko(new Error("foto")); }, "image/jpeg", 0.82);
    };
    img.onerror = function(){ ko(new Error("foto")); };
    img.src = url;
  });
}

function nEnvia(fila, blob){
  var u = sesionNube.user.id;
  var paso = Promise.resolve(null);
  if(blob){
    var ruta = u + "/" + Date.now() + ".jpg";
    paso = nube.storage.from("comidas").upload(ruta, blob, {contentType:"image/jpeg"}).then(function(r){
      if(r.error) throw r.error; return ruta;
    });
  }
  return paso.then(function(ruta){
    var f = nSel(), k = nut.mom || nMomDeHora(nHora());
    fila.user_id = u; fila.fecha = f; fila.hora = nHoraPara(k, f);
    if(ruta) fila.foto = ruta;
    return nube.from("comidas").insert(fila).select().single();
  }).then(function(r){
    if(r.error) throw r.error;
    nut.comidas.push(r.data); nPinta(); nSondea();
    if(r.data.estado === "pendiente" && nut.plan === "pago") return nAnaliza(r.data.id);
  });
}
function nAnaliza(id){
  return nube.functions.invoke("analiza-comida", {body:{id:id}}).then(function(r){
    if(r.error){
      return r.error.context && r.error.context.json ? r.error.context.json().then(function(j){
        nut.aviso = j.error === "sin_clave" ? "La foto con IA se activa en unos días. De momento, apúntala a mano."
          : j.error === "tope" ? "Has llegado al tope de fotos de hoy. Apunta el resto a mano." : (j.nota || "No se pudo calcular.");
      })["catch"](function(){}) : null;
    }
  }).then(function(){ return nCarga(); }).then(nPinta);
}

/* detalle: corregir gramos (recalcula en proporción), responder la pregunta o borrar */
function nAbreComida(id){
  var c = nut.comidas.filter(function(x){ return x.id === id; })[0];
  if(!c) return;
  var items = (c.items || []).map(function(i){ return Object.assign({}, i); });
  var filas = items.map(function(i, k){
    return '<div class="nit"><span>' + esc(i.nombre) + '<small>' + i.kcal + ' kcal, ' + i.prot + ' g prot</small></span>' +
      (i.gramos ? '<input data-it="' + k + '" inputmode="numeric" value="' + i.gramos + '"><em>g</em>' : '') + '</div>';
  }).join("");
  nHoja('<h2>' + esc(nNombre(c)) + '</h2>' +
    (c.estado === "hecha" ? '<p class="frase">' + c.kcal + ' kcal, ' + c.prot + ' g de proteína, ' + (c.carb || 0) + ' g de hidratos, ' + (c.grasa || 0) + ' g de grasa' +
      (c.confianza ? '. Confianza ' + c.confianza : '') + '.</p>' : '<p class="frase">' + esc(c.nota || "Calculando…") + '</p>') +
    (filas ? '<div class="nits">' + filas + '</div>' : '') +
    (c.nota && c.estado === "hecha" ? '<p class="frase">' + esc(c.nota) + '</p>' : '') +
    (c.pregunta && nPuede() ? '<div class="campo" style="text-align:left"><label for="n-resp">' + esc(c.pregunta) + '</label><input id="n-resp" placeholder="Tu respuesta"></div>' : '') +
    '<p class="frase" style="margin:0 0 6px">Cajita:</p><div class="chips nrep">' + N_MOM.map(function(m){
      return '<button class="chip' + (m.k === nMomDeHora(c.hora) ? ' now' : '') + '" data-mueve="' + m.k + '">' + m.t + '</button>'; }).join("") + '</div>' +
    '<div class="stack">' + (filas || c.pregunta ? '<button class="btn primary" id="n-ok">Guardar</button>' : '') +
    '<button class="btn ghost" id="n-del">Borrar</button><button class="btn ghost" data-cierra>Cerrar</button></div>',
    function(el, cierra){
      el.querySelectorAll("[data-mueve]").forEach(function(b){
        b.addEventListener("click", function(){
          var hNueva = nMom(b.dataset.mueve).h;
          nube.from("comidas").update({hora:hNueva}).eq("id", c.id).then(function(){ c.hora = hNueva; nPinta(); cierra(); });
        });
      });
      var ok = el.querySelector("#n-ok");
      if(ok) ok.addEventListener("click", function(){
        var resp = el.querySelector("#n-resp"), r = resp ? resp.value.trim() : "";
        if(r && nPuede()){
          /* con respuesta, se vuelve a calcular con ese dato */
          var d = (c.descripcion ? c.descripcion + ". " : "") + c.pregunta + " " + r;
          nube.from("comidas").update({estado:"pendiente", descripcion:d, pregunta:null}).eq("id", c.id).then(function(){
            c.estado = "pendiente"; c.descripcion = d; c.pregunta = null; nPinta(); nSondea(); cierra();
            if(nut.plan === "pago") nAnaliza(c.id);
          });
          return;
        }
        el.querySelectorAll("[data-it]").forEach(function(inp){
          var k = +inp.dataset.it, g = parseInt(inp.value, 10), it = items[k];
          if(g > 0 && it.gramos > 0 && g !== it.gramos){
            var f = g / it.gramos;
            ["kcal", "prot", "carb", "grasa"].forEach(function(m){ it[m] = Math.round((it[m] || 0) * f); });
            it.gramos = g;
          }
        });
        var t = {items:items, kcal:0, prot:0, carb:0, grasa:0};
        items.forEach(function(i){ t.kcal += i.kcal || 0; t.prot += i.prot || 0; t.carb += i.carb || 0; t.grasa += i.grasa || 0; });
        nube.from("comidas").update(t).eq("id", c.id).then(function(){ Object.assign(c, t); nPinta(); cierra(); });
      });
      el.querySelector("#n-del").addEventListener("click", function(){
        nube.from("comidas").delete().eq("id", c.id).then(function(){
          if(c.foto) nube.storage.from("comidas").remove([c.foto]);
          nut.comidas = nut.comidas.filter(function(x){ return x.id !== c.id; }); nPinta(); cierra();
        });
      });
    });
}

      });

    else if(q === "whoop-off"){

  h += bloque(1, "Todo el año, la base", [
    "Un poco más de lo que gastas: un 5 a 20 % por encima de mantenimiento. Cuanto más tiempo lleves entrenando, más cerca del 5 %." + info("superavit"),
    "Si tu peso lleva meses parado, lo que comes ahora es tu mantenimiento. Súmale el superávit a eso.",
    "La báscula manda: ganar <b>" + gMin + " a " + gMax + " g a la semana</b>, de " + kMesMin + " a " + kMesMax + " kg al mes. Si llevas años entrenando, la parte baja. Mira la media de la semana, no el dato de un día. Si sube más, sobra comida; si no sube en tres semanas, falta.",

    "Grasa <b>" + grMin + " a " + grMax + " g</b> al día, de 0,5 a 1,5 g por kilo. Ni muy baja ni muy alta.",

    "Dormir 7 a 9 horas. Ahí se construye el músculo y se reparan los tendones."]);
  h += bloque(2, "Ciclos 1 a 3: volumen alto", [

    "Superávit en la parte alta de tu horquilla: es el momento de construir.",

function restaura(txt){
  var o;
  try{ o = JSON.parse(decodeURIComponent(escape(atob(String(txt).trim())))); }
  catch(e){ return "Ese código no vale. Cópialo entero, sin espacios ni saltos de línea."; }
  if(!o || o.v !== 1) return "Ese código no es de esta app.";
  confirma("¿Sustituyo el entrenamiento?",
    "Lo de este dispositivo se pierde y entra el del código.",
    "Sí, restaurar",
    function(){
      state = merge(state, o);
      state.ts = Date.now();
      try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){}
      save(); render();
      var e2 = document.getElementById("cod-estado");
      if(e2) e2.textContent = "Listo, entrenamiento restaurado.";
    });
  return "";
}

/* fuera del visor de claude.ai no hay capacidad de descarga: se guarda a la vieja usanza */
function guardaSuelto(nombre, texto){
  try{
    var b = new Blob(["﻿" + texto], {type:"text/csv;charset=utf-8"});
    var u = URL.createObjectURL(b), a = document.createElement("a");
    a.href = u; a.download = nombre; a.style.display = "none";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); }, 1000);
    return true;
  }catch(e){ return false; }
}
function enCaja(texto){
  var c = document.getElementById("dl-caja");
  if(!c){ estado("No se ha podido preparar el archivo."); return; }
  c.hidden = false; c.value = texto;
  c.focus(); c.select();
  estado("Selecciona todo el recuadro, cópialo y pégalo en Excel.");
}
function alPortapapeles(texto){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(texto).then(function(){
        estado("Copiado. Pégalo en Excel y guárdalo como CSV.");
      })["catch"](function(){ enCaja(texto); });
      return;
    }
  }catch(e){}
  enCaja(texto);
}
function descarga(nombre, texto, vacio){
  var caja = document.getElementById("dl-caja");
  if(caja) caja.hidden = true;
  if(vacio){ estado("Todavía no hay nada que exportar."); return; }
  if(dl){
    estado("Preparando el archivo.");
    dl.save({filename:nombre, data:"\ufeff" + texto}).then(function(){
      estado("Archivo guardado.");
    })["catch"](function(e){
      var c = e && e.code;
      if(c === "declined"){ estado("Descarga cancelada."); return; }
      if(c === "rate_limited"){ estado("Espera un momento y vuelve a darle."); return; }
      estado("No se ha podido guardar. Te lo copio al portapapeles.");
      alPortapapeles(texto);
    });
    return;
  }
  /* sin la capacidad de descarga: fuera del visor vale el método clásico,
     dentro el navegador lo bloquea, así que va al portapapeles */
  if(!(window.claude && window.claude.use)){
    estado(guardaSuelto(nombre, texto) ? "Archivo guardado." : "No se ha podido guardar el archivo.");
    return;
  }
  alPortapapeles(texto);
}

  var s = atob((b + "===".slice((b.length + 3) % 4)).replace(/-/g, "+").replace(/_/g, "/"));
  var a = new Uint8Array(s.length);
  for(var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);

}
function uuidAviso(){

  catch(e){
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c){

    });

}

/* ---- plan B de los avisos: la app ntfy, sin servidor propio ----
   Si el servidor de AVISOS.md no está montado, la app puede avisar por ntfy:
   publica en un canal privado y la app ntfy del iPhone lo convierte en
   notificación. ntfy no deja anular un mensaje ya programado, así que solo
   se programa al salir de la app con el cronómetro corriendo. */
function creaTemaNtfy(){
  var abc = "abcdefghjkmnpqrstuvwxyz23456789", t = "cuaderno-";
  for(var i = 0; i < 10; i++) t += abc[Math.floor(Math.random() * abc.length)];
  state.ntfy = t; save();
  return t;
}
function mandaNtfy(seg, titulo, cuerpo){
  if(!state.ntfy) return;
  /* todo va en la URL y el texto en el cuerpo: así la petición es "simple"
     y puede salir por sendBeacon, que el navegador garantiza aunque esté
     congelando la página, que es justo el momento en que se manda */
  var u = "https://ntfy.sh/" + state.ntfy +
    "?title=" + encodeURIComponent(titulo) + "&priority=high&tags=stopwatch" +
    (seg >= 10 ? "&delay=" + Math.round(seg) + "s" : "");
  var fue = false;
  try{ if(navigator.sendBeacon) fue = navigator.sendBeacon(u, cuerpo); }catch(e){}
  if(!fue){
    try{ fetch(u, {method:"POST", keepalive:true, body:cuerpo})["catch"](function(){}); }catch(e2){}
  }
}
function programaNtfy(){
  if(!T.int || pushActivo() || !state.ntfy) return;
  var qN = Math.round((T.fin - Date.now()) / 1000);
  if(qN < 5 || T.ntfyMarca === T.fin) return;
  T.ntfyMarca = T.fin;
  mandaNtfy(Math.max(10, qN + 2), "Descanso terminado", (T.lab || "Vuelve a la barra") + ". Abre la app y sigue.");
}

document.addEventListener("visibilitychange", function(){

});

/* ============================ CRONÓMETRO ============================ */
var T = {fin:0, total:0, lab:"", sub:"", int:null, wake:null, son:false, prox:0, aviso:null};
var actx = null;

/* El aviso suena con Web Audio y por eso se mezcla con tu música sin pararla.
   El precio es que el interruptor de silencio del iPhone lo calla: es la regla
   de iOS para los sonidos de una web. "transient" avisa al sistema de que es
   un sonido corto, de los que conviven con lo que esté sonando. */
try{ if(navigator.audioSession) navigator.audioSession.type = "transient"; }catch(e){}
function paraAlarma(){ T.son = false; T.prox = 0; }
function vibra(){ try{ if(navigator.vibrate) navigator.vibrate([120, 70, 120]); }catch(e){} }

function beep(){
  try{
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.18, 0.36].forEach(function(t){
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = "square"; o.frequency.value = t === 0.36 ? 1320 : 880;
      g.gain.setValueAtTime(0.0001, actx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.3, actx.currentTime + t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + t + 0.14);
      o.connect(g); g.connect(actx.destination);
      o.start(actx.currentTime + t); o.stop(actx.currentTime + t + 0.16);
    });
  }catch(e){}
}
function startTimer(seg, lab, sub){
  paraAlarma();
  anulaAviso(T.aviso);
  T.aviso = programaAviso(seg + 3, "Descanso terminado",
    (lab || "Vuelve a la barra") + (sub ? ". " + sub : ""));
  T.fin = Date.now() + seg * 1000; T.total = seg; T.lab = lab || "Descanso"; T.sub = sub || "";
  document.getElementById("timer").hidden = false;
  document.getElementById("tlab").textContent = T.lab;
  document.getElementById("tsub").textContent = T.sub;
  document.getElementById("tfuera").hidden = !!(pushActivo() || state.ntfy);
  var v0 = document.getElementById("vivo");
  if(v0) v0.textContent = "";
  if(!actx){ try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state === "suspended") actx.resume();
  try{
    if(navigator.wakeLock && !T.wake)
      navigator.wakeLock.request("screen").then(function(w){ T.wake = w; })["catch"](function(){});
  }catch(e){}
  clearInterval(T.int); T.int = setInterval(tick, 200); tick();
}
function stopTimer(){
  paraAlarma();
  anulaAviso(T.aviso); T.aviso = null;
  clearInterval(T.int); T.int = null;
  document.getElementById("timer").hidden = true;
  document.getElementById("timer").classList.remove("late");
  try{ if(T.wake){ T.wake.release(); T.wake = null; } }catch(e){}
}
function tick(){
  var q = Math.round((T.fin - Date.now()) / 1000);
  document.getElementById("tnum").textContent = mmss(q);
  document.getElementById("ttrack").style.width =
    Math.max(0, Math.min(100, q / T.total * 100)) + "%";
  if(q <= 0){
    if(T.aviso){ anulaAviso(T.aviso); T.aviso = null; }  /* estás dentro: pita la app */
    document.getElementById("timer").classList.add("late");
    var vv = document.getElementById("vivo");
    if(vv && vv.textContent !== "Descanso terminado") vv.textContent = "Descanso terminado";
    /* pita una y otra vez hasta que pares el cronómetro, sumes 30 segundos
       o marques la siguiente serie */
    if(Date.now() >= T.prox){ T.prox = Date.now() + 1800; beep(); vibra(); }
  }
  if(q < -600) stopTimer();
}

/* Al cerrar una serie de básico arranca el descanso. Si es la última y el
   ciclo lleva rest pause, en su lugar arrancan solos los 15 segundos. */
function trasSerie(p, e, i, j){
  var c = cargas(p, e), q = 0;
  c.forEach(function(x, k){ if(!setHecho(e, i, k, teoDe(e, x.kg), x.reps)) q++; });
  if(fase(p.f).rp && j === c.length - 1 && !(apunte(i, j) || {}).rp2){
    startTimer(15, "Rest pause", "Al cero, sigue hasta el fallo y apunta esas reps");
    return;
  }
  startTimer(descansoDe(p, e), e.n,
    q > 0 ? "Quedan " + q + " serie" + (q > 1 ? "s" : "") : "Ejercicio terminado");
}

    avisoCuenta(crear ? "Creando la cuenta." : "Entrando.");
    var cred = {email:mail.trim(), password:pass};
    var pr = crear ? nube.auth.signUp(cred) : nube.auth.signInWithPassword(cred);
    pr.then(function(r){
      if(r.error){ avisoCuenta(traduceError(r.error.message)); return; }
      if(crear && r.data && r.data.user && !r.data.session){
        avisoCuenta("Cuenta creada. Te hemos mandado un correo: confírmalo y vuelve a entrar.");
        return;
      }
      avisoCuenta("");
    })["catch"](function(e){ avisoCuenta(traduceError(e && e.message)); });
    return;
  }
  if(ev.target.id === "au-revisar"){
    avisoCuenta("Comprobando.");
    cargaAcceso().then(function(e){
      if(aprobado()){ avisoCuenta("Ya tienes acceso, sincronizando."); cargaNube(); }
      else{ avisoCuenta("Todavía no. Vuelve a probar más tarde."); render(); }
    });
    return;
  }
  if(ev.target.id === "au-salir"){
    avisoCuenta("Saliendo de la cuenta.");
    nube.auth.signOut().then(function(){ avisoCuenta(""); })["catch"](function(){});
    return;
  }
  if(ev.target.id === "cod-sacar"){
    var c = codigo(), caja = document.getElementById("cod-caja");
    document.getElementById("cod-ok").hidden = true;
    if(!c){ document.getElementById("cod-estado").textContent = "No se ha podido generar el código."; return; }
    caja.hidden = false; caja.readOnly = true; caja.value = c; caja.focus(); caja.select();
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(c).then(function(){
          document.getElementById("cod-estado").textContent = "Código copiado. Pégalo en el otro dispositivo.";
        })["catch"](function(){
          document.getElementById("cod-estado").textContent = "Selecciona el recuadro y cópialo a mano.";
        });
        return;
      }
    }catch(e){}
    document.getElementById("cod-estado").textContent = "Selecciona el recuadro y cópialo a mano.";
    return;
  }
  if(ev.target.id === "cod-meter"){
    var cj = document.getElementById("cod-caja");
    cj.hidden = false; cj.readOnly = false; cj.value = ""; cj.focus();
    document.getElementById("cod-ok").hidden = false;
    document.getElementById("cod-estado").textContent = "Pega el código del otro dispositivo y dale a Restaurar.";
    return;
  }
  if(ev.target.id === "cod-ok"){
    var msg = restaura(document.getElementById("cod-caja").value);
    var e2 = document.getElementById("cod-estado");
    if(e2 && msg) e2.textContent = msg;
    return;
  }
  if(ev.target.id === "dl-marcas"){
    descarga("progresion-maximales.csv", csvMarcas(), !(state.marcas || []).length); return;
  }
  if(ev.target.id === "dl-ses"){
    descarga("sesiones.csv", csvSesiones(), !(state.hechas || []).length); return;
  }
  if(ev.target.id === "dl-series"){
    descarga("series.csv", csvSeries(), !(state.registros || []).length); return;
  }
  if(ev.target.id === "reset-sets"){
    confirma("¿Borro lo apuntado hoy?",
      "Se vacía lo marcado en esta sesión para empezarla de cero. Tus marcas y tu historial no se tocan.",
      "Sí, borrarlo",
      function(){ sesion.sets = {}; sesion.log = {}; saveSesion(); render(); });
    return;
  }
  if(ev.target.id === "atras"){
    confirma("¿Vuelves a la sesión anterior?",
      "Retrocedes una sesión en el plan y lo apuntado hoy se vacía.",
      "Sí, volver",
      function(){
        var p3 = state.pos;
        if(p3.e > 0) p3.e--;
        else if(p3.s > 0){ p3.s--; p3.e = porSemana(fase(p3.f)) - 1; }
        else if(p3.f > 0){ p3.f--; p3.s = fase(p3.f).sem - 1; p3.e = porSemana(fase(p3.f)) - 1; }
        sesion = {}; saveSesion(); save(); render();
      });
    return;
  }
  if(ev.target.id === "test-ok"){
    state.tests[fase(state.pos.f).id] = true; save(); render(); return;
  }
});

    }

  if(t.dataset.rm){

    if(!isNaN(v) && v > 0){
      state.rms[t.dataset.rm] = v;
      state.rmsFecha[t.dataset.rm] = hoy();
      state.ejemplo = false;
      var f = fase(state.pos.f);
      if(f.test) state.tests[f.id] = true;
      save();

    return;
  }
  if(t.id === "peso-corp"){

    return;

  if(t.dataset.peso){

/* ---------- arrastrar los cuadrados del orden ----------
   Mientras se arrastra no se toca el DOM: mover el nodo arrastrado cancelaría
   la captura del puntero y el arrastre se cortaría al primer salto. Lo que se
   mueve son las transformaciones, y el orden se guarda al soltar. */
function etiquetasOrden(fila, lista){
  var n = lista.length, letras = [];
  lista.forEach(function(c, k){
    c.querySelector(".ordpos").textContent = (k + 1) + "º";
    c.setAttribute("aria-label", "Entreno " + c.dataset.l + ", posición " + (k + 1) + " de " + n);
    c.classList.toggle("primero", k === 0);
    letras.push(c.dataset.l);
  });
  var txt = fila.parentElement.querySelector(".ordtxt");
  if(txt) txt.textContent = "Empiezas por el " + letras[0] +
    ", luego el " + letras.slice(1).join(", luego el ") + ", y vuelta a empezar.";
  return letras;
}
function guardaOrden(rut, letras){
  state.orden = state.orden || {};
  state.orden[rut] = letras;
  state.pos.e = 0; sesion = {}; saveSesion(); save();
}

document.addEventListener("pointerdown", function(ev){
  var cuadro = ev.target.closest(".ordcuadro");
  if(!cuadro) return;
  var fila = cuadro.closest("[data-ord]");
  if(!fila) return;

  var tiles = Array.prototype.slice.call(fila.querySelectorAll(".ordcuadro"));
  var origen = tiles.indexOf(cuadro), destino = origen;
  var ancho = cuadro.offsetWidth + 7, x0 = ev.clientX, movido = false;

  try{ cuadro.setPointerCapture(ev.pointerId); }catch(e){}
  cuadro.classList.add("arrastrando");

  function ordenActual(){
    var o = tiles.slice();
    o.splice(origen, 1);
    o.splice(destino, 0, cuadro);
    return o;
  }
  function mueve(e){
    var dx = e.clientX - x0;
    if(!movido && Math.abs(dx) < 4) return;
    movido = true;
    destino = Math.max(0, Math.min(tiles.length - 1, origen + Math.round(dx / ancho)));
    cuadro.style.transform = "translateX(" + dx + "px)";
    tiles.forEach(function(t, k){
      if(t === cuadro) return;
      var d = 0;
      if(destino > origen && k > origen && k <= destino) d = -ancho;
      if(destino < origen && k >= destino && k < origen) d = ancho;
      t.style.transform = d ? "translateX(" + d + "px)" : "";
    });
    etiquetasOrden(fila, ordenActual());
  }
  function suelta(){
    document.removeEventListener("pointermove", mueve);
    document.removeEventListener("pointerup", suelta);
    document.removeEventListener("pointercancel", suelta);
    cuadro.classList.remove("arrastrando");
    tiles.forEach(function(t){ t.style.transform = ""; });
    if(!movido) return;
    var letras = ordenActual().map(function(t){ return t.dataset.l; });
    guardaOrden(fila.dataset.ord, letras);
    render();
  }
  document.addEventListener("pointermove", mueve);
  document.addEventListener("pointerup", suelta);
  document.addEventListener("pointercancel", suelta);
});

/* y con el teclado, para quien no quiera arrastrar */
document.addEventListener("keydown", function(ev){
  if(ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
  var cuadro = document.activeElement;
  if(!cuadro || !cuadro.classList || !cuadro.classList.contains("ordcuadro")) return;
  var fila = cuadro.closest("[data-ord]");
  var tiles = Array.prototype.slice.call(fila.querySelectorAll(".ordcuadro"));
  var i = tiles.indexOf(cuadro), j = i + (ev.key === "ArrowRight" ? 1 : -1);
  if(j < 0 || j >= tiles.length) return;
  ev.preventDefault();
  tiles.splice(i, 1); tiles.splice(j, 0, cuadro);
  var letra = cuadro.dataset.l;
  guardaOrden(fila.dataset.ord, tiles.map(function(t){ return t.dataset.l; }));
  render();
  var vuelve = document.querySelector('[data-ord="' + fila.dataset.ord + '"] .ordcuadro[data-l="' + letra + '"]');
  if(vuelve) vuelve.focus();
});

function adopta(o){
  if(!o || o.v !== 1) return false;
  state = merge(state, o);
  try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){}
  return true;
}
function escucha(){
  var r = docRef();
  if(!r || subs) return;
  subs = r.onSnapshot(function(snap){
    if(!snap.exists) return;
    var o = snap.data();
    if(o && o.v === 1 && (o.ts || 0) > (state.ts || 0)){ adopta(o); render(); }
  }, function(){});
}
function arranca(){
  if(!db){ cuenta.sync = "local"; render(); return; }
  cuenta.sync = uid ? "cuenta" : "artefacto";
  var r = docRef();
  r.get().then(function(snap){
    if(snap.exists){ if(adopta(snap.data())) render(); escucha(); return; }
    if(!uid){ escucha(); save(); return; }
    /* primera vez con identidad: recoge lo que hubiera en el documento común */
    return db.doc("plan/state").get().then(function(viejo){
      if(viejo.exists && adopta(viejo.data())) render();
      escucha(); save();
    });
  })["catch"](function(){ cuenta.sync = "local"; render(); });
}

/* la app se instala y funciona sin cobertura gracias a esto */
var swReg = null;
if("serviceWorker" in navigator && location.protocol === "https:"){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").then(function(r){ swReg = r; })["catch"](function(){});
  });
  /* si entra una versión nueva mientras la tienes abierta, recarga una vez */
  var recargado = false;
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    if(recargado) return;
    recargado = true;
    location.reload();
  });
}

/* Una app instalada puede quedarse abierta días: la página no se vuelve a pedir
   y los cambios no llegan. Al volver a ella se compara la versión publicada con
   la que corre y, si hay otra, se ofrece actualizar. */
var ultimaComprobacion = 0;
function compruebaVersion(aMano){
  if(location.protocol !== "https:"){
    var e0 = document.getElementById("ver-estado");
    if(aMano && e0) e0.textContent = "Solo funciona en la versión publicada.";
    return Promise.resolve(false);
  }
  ultimaComprobacion = Date.now();
  if(swReg){ try{ swReg.update()["catch"](function(){}); }catch(e){} }
  return fetch(location.pathname.split("/").pop() || "index.html", {cache:"no-store"}).then(function(r){ return r.text(); })
    .then(function(txt){
      var m = /var VERSION = "([^"]+)"/.exec(txt);
      var nueva = !!(m && m[1] !== VERSION);
      document.getElementById("nueva").hidden = !nueva;
      if(aMano){
        var e = document.getElementById("ver-estado");
        if(e) e.textContent = nueva ? "Hay una versión nueva, actualizando." : "Ya tienes la última versión.";
        if(nueva) setTimeout(actualizaApp, 600);
      }
      return nueva;
    })["catch"](function(){ return false; });
}
function actualizaApp(){ location.reload(); }
document.getElementById("nueva-btn").addEventListener("click", actualizaApp);
document.addEventListener("visibilitychange", function(){
  if(document.hidden || Date.now() - ultimaComprobacion < 10 * 60 * 1000) return;
  compruebaVersion(false);
});
setTimeout(function(){ compruebaVersion(false); }, 4000);
