<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Plan de entrenamiento por ciclos, con cronometro de descanso y calculo de pesos desde tus maximales.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="theme-color" content="#1B4DE4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cuaderno">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<style>
  :root{color-scheme:light dark;
        padding-top:env(safe-area-inset-top, 0px);
        padding-bottom:env(safe-area-inset-bottom, 0px)}
  body{margin:0; font:14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif}
  img{max-width:100%}
  [hidden]{display:none !important}
</style>
<title>Cuaderno de Fuerza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;450;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#EFEEE9; --surface:#FFFFFF; --surface-2:#F6F5F1;
    --ink:#15171C; --ink-2:#5B6270; --ink-3:#8A909C;
    --line:#DDDAD2; --line-2:#C9C5BB;
    --accent:#1B4DE4; --accent-ink:#FFFFFF; --accent-soft:#E4EAFD;
    --warn:#C8102E; --warn-soft:#FBE4E7;
    --deload:#B8860B; --deload-soft:#FAF0D8;
    --ok:#17754B; --ok-soft:#E0F1E8;
    --p25:#C8102E; --p20:#1B4DE4; --p15:#E0A800; --p10:#1E8E5A; --p5:#F3F1EC; --p2:#6E7481; --p1:#A9AEB8;
    --radius:14px;
    --shadow:0 1px 2px rgba(20,22,28,.06), 0 6px 18px -10px rgba(20,22,28,.22);
    --tabh:62px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0D0F12; --surface:#161A1F; --surface-2:#1D222A;
      --ink:#ECEEF1; --ink-2:#9AA1AD; --ink-3:#6E7682;
      --line:#262B33; --line-2:#333A44;
      --accent:#5B87FF; --accent-ink:#0B0D10; --accent-soft:#17203A;
      --warn:#FF5F70; --warn-soft:#2E161B;
      --deload:#F0C24A; --deload-soft:#2B2413;
      --ok:#45CB8D; --ok-soft:#10261D;
      --p5:#D8D5CE;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0D0F12; --surface:#161A1F; --surface-2:#1D222A;
    --ink:#ECEEF1; --ink-2:#9AA1AD; --ink-3:#6E7682;
    --line:#262B33; --line-2:#333A44;
    --accent:#5B87FF; --accent-ink:#0B0D10; --accent-soft:#17203A;
    --warn:#FF5F70; --warn-soft:#2E161B;
    --deload:#F0C24A; --deload-soft:#2B2413;
    --ok:#45CB8D; --ok-soft:#10261D;
    --p5:#D8D5CE;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.7);
  }

  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  #app{max-width:520px; margin:0 auto; padding:0 16px;
       padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom, 0px) + 96px)}
  h1,h2,h3{font-family:"Saira Condensed",Impact,sans-serif; font-weight:700; margin:0;
           letter-spacing:.01em; text-wrap:balance}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
  button{font:inherit; color:inherit; cursor:pointer; border:none; background:none}
  button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  input{font:inherit; color:inherit}

  /* ---------- cabecera ---------- */
  .top{position:sticky; top:env(safe-area-inset-top, 0px); z-index:30;
       background:color-mix(in srgb, var(--bg) 88%, transparent);
       backdrop-filter:blur(12px); margin:0 -16px; padding:10px 16px 8px;
       border-bottom:1px solid var(--line)}
  .top-row{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
  .brand{font-family:"Saira Condensed",sans-serif; font-weight:700; font-size:19px; letter-spacing:.02em;
         text-transform:uppercase}
  .brand span{color:var(--accent)}
  .where{font-size:12px; color:var(--ink-2); font-weight:500}
  .bar{height:5px; border-radius:99px; background:var(--line); margin-top:8px; overflow:hidden; display:flex}
  .bar i{display:block; height:100%; background:var(--accent)}
  .bar i.deload{background:var(--deload)}

  /* ---------- bloques ---------- */
  .sect{margin:20px 0 0}
  .eyebrow{font-family:"Saira Condensed",sans-serif; font-size:12px; letter-spacing:.14em;
           text-transform:uppercase; color:var(--ink-3); font-weight:600; margin-bottom:7px}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px}
  .stack{display:flex; flex-direction:column; gap:10px}

  /* aviso destacado */
  .flag{border-radius:var(--radius); padding:13px 14px; display:flex; gap:11px; align-items:flex-start}
  .flag .ic{flex:0 0 auto; width:26px; height:26px; border-radius:8px; display:grid; place-items:center;
            font-family:"Saira Condensed",sans-serif; font-size:15px; font-weight:700}
  .flag h3{font-size:17px; line-height:1.15}
  .flag p{margin:3px 0 0; font-size:13.5px; line-height:1.4}
  .flag.test{background:var(--warn-soft); color:var(--warn)}
  .flag.test .ic{background:var(--warn); color:var(--surface)}
  .flag.deload{background:var(--deload-soft); color:var(--deload)}
  .flag.deload .ic{background:var(--deload); color:var(--surface)}
  .flag.info{background:var(--accent-soft); color:var(--accent)}
  .flag.info .ic{background:var(--accent); color:var(--accent-ink)}
  .flag .act{margin-top:9px; display:inline-block; background:currentColor; border-radius:8px;
             padding:6px 11px; font-size:12.5px; font-weight:600; font-family:"IBM Plex Sans",sans-serif}
  .flag .act span{color:var(--surface)}
  .flag.deload .act span,.flag.test .act span{color:var(--surface)}

  /* cabecera de la sesión */
  .today{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
         padding:15px; display:flex; align-items:flex-start; gap:14px}
  .today > div:last-child{flex:1 1 auto; min-width:0}
  .letter{width:52px; height:52px; border-radius:13px; background:var(--accent); color:var(--accent-ink);
          font-family:"Saira Condensed",sans-serif; font-size:30px; font-weight:700; display:grid;
          place-items:center; flex:0 0 auto}
  .letter.f{background:var(--warn); color:var(--surface)}
  .today h2{font-size:21px; line-height:1.1}
  .today .sub{font-size:12.5px; color:var(--ink-2); margin-top:2px}

  /* ejercicios */
  .ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
  .ex + .ex{margin-top:9px}
  .ex.done{border-color:var(--ok); background:var(--ok-soft)}
  .ex-head{display:flex; align-items:center; gap:11px; padding:12px 13px; width:100%; text-align:left}
  .tag{flex:0 0 auto; font-family:"Saira Condensed",sans-serif; font-size:10.5px; letter-spacing:.1em;
       text-transform:uppercase; font-weight:600; padding:3px 6px; border-radius:6px;
       background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line)}
  .tag.b{background:var(--accent); color:var(--accent-ink); border-color:transparent}
  .tag.js{background:var(--deload-soft); color:var(--deload); border-color:transparent}
  .ex-name{font-weight:600; font-size:15px; line-height:1.25; flex:1 1 auto}
  .ex-load{text-align:right; flex:0 0 auto}
  .ex-load b{font-family:"IBM Plex Mono",monospace; font-size:16px; font-weight:600; display:block;
             font-variant-numeric:tabular-nums}
  .ex-load small{font-size:11px; color:var(--ink-2); display:block; margin-top:-1px}
  .ex-body{padding:0 13px 13px; border-top:1px solid var(--line)}
  .ex.done .ex-body{border-color:color-mix(in srgb, var(--ok) 35%, transparent)}

  .sets{display:grid; grid-template-columns:repeat(auto-fit, minmax(84px, 1fr)); gap:8px; margin-top:13px}
  .set{border:1.5px solid var(--line-2); border-radius:13px; padding:11px 8px; min-height:62px;
       background:var(--surface); display:flex; flex-direction:column; align-items:center;
       justify-content:center; gap:2px; transition:transform .1s ease, background .15s ease}
  .set:active{transform:scale(.96)}
  .set b{font-family:"IBM Plex Mono",monospace; font-size:17px; font-weight:600; line-height:1.1}
  .set small{font-size:11px; color:var(--ink-2); letter-spacing:.01em}
  .set.on{background:var(--ok); border-color:var(--ok); color:var(--surface)}
  .set.on small{color:var(--surface); opacity:.9}
  .set.on b::after{content:" ✓"; font-size:12px; opacity:.8}
  .plates{margin-top:11px; display:flex; align-items:center; gap:4px; flex-wrap:wrap;
          font-size:11.5px; color:var(--ink-2)}
  .plate{display:inline-grid; place-items:center; min-width:24px; height:22px; border-radius:5px; padding:0 5px;
         font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:600; color:#fff}
  .plate.l{color:#15171C}
  .note{font-size:12.5px; color:var(--ink-2); margin:10px 0 0; line-height:1.4}
  .wfield{margin-top:11px; display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-2)}
  .wfield input{width:74px; padding:6px 8px; border-radius:9px; border:1px solid var(--line-2);
                background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:14px}

  /* botones */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; border-radius:11px;
       padding:12px 15px; font-weight:600; font-size:14.5px; background:var(--surface-2);
       border:1px solid var(--line); width:100%}
  .btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent}
  .btn.ghost{background:transparent}
  .btn.sm{padding:8px 11px; font-size:13px; width:auto}
  .btn[disabled]{opacity:.45; cursor:default}
  .row{display:flex; gap:9px}

  /* cronómetro */
  .timer{position:fixed; left:0; right:0; z-index:40;
         bottom:calc(var(--tabh) + env(safe-area-inset-bottom, 0px));
         display:flex; justify-content:center; padding:0 12px 10px; pointer-events:none}
  .timer-in{pointer-events:auto; width:100%; max-width:496px; background:var(--surface);
            border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow);
            padding:11px 13px; display:flex; align-items:center; gap:12px}
  .timer.late .timer-in{border-color:var(--ok); background:var(--ok-soft)}
  .t-num{font-family:"IBM Plex Mono",monospace; font-size:31px; font-weight:600; letter-spacing:-.02em;
         font-variant-numeric:tabular-nums; line-height:1; min-width:86px}
  .t-lab{flex:1 1 auto; font-size:12px; color:var(--ink-2); line-height:1.3}
  .t-lab b{display:block; color:var(--ink); font-size:13.5px; font-weight:600}
  .t-btn{width:40px; height:40px; border-radius:11px; background:var(--surface-2); border:1px solid var(--line);
         display:grid; place-items:center; font-size:12px; font-weight:600; flex:0 0 auto;
         font-family:"IBM Plex Mono",monospace}
  .t-btn.stop{background:var(--accent); color:var(--accent-ink); border-color:transparent}
  .t-track{height:3px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:8px}
  .t-track i{display:block; height:100%; background:var(--accent); transition:width .25s linear}

  /* tabs */
  .tabs{position:fixed; left:0; right:0; bottom:0; z-index:50; background:var(--surface);
        border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom, 0px)}
  .tabs-in{max-width:520px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr)}
  .tab{height:var(--tabh); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
       font-family:"Saira Condensed",sans-serif; font-size:12.5px; letter-spacing:.08em; text-transform:uppercase;
       font-weight:600; color:var(--ink-3)}
  .tab svg{width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.9;
           stroke-linecap:round; stroke-linejoin:round}
  .tab[aria-selected="true"]{color:var(--accent)}

  /* maximales */
  .rm{display:flex; align-items:center; gap:11px; padding:11px 0}
  .rm + .rm{border-top:1px solid var(--line)}
  .rm-n{flex:1 1 auto; font-weight:600; font-size:14.5px}
  .rm-n small{display:block; font-weight:400; font-size:11.5px; color:var(--ink-3)}
  .rm input{width:84px; padding:8px 9px; border-radius:10px; border:1px solid var(--line-2);
            background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:16px;
            text-align:right; font-variant-numeric:tabular-nums}
  .rm .u{font-size:12px; color:var(--ink-3); width:16px}

  table{width:100%; border-collapse:collapse; font-size:13.5px}
  th,td{text-align:left; padding:7px 6px; border-bottom:1px solid var(--line)}
  th{font-family:"Saira Condensed",sans-serif; font-size:11.5px; letter-spacing:.08em; text-transform:uppercase;
     color:var(--ink-3); font-weight:600}
  td.n,th.n{text-align:right; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
  .scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}

  /* plan */
  .ph{display:flex; gap:12px; padding:11px 0; align-items:flex-start}
  .ph + .ph{border-top:1px solid var(--line)}
  .ph-dot{flex:0 0 auto; width:30px; height:30px; border-radius:9px; background:var(--surface-2);
          border:1px solid var(--line); display:grid; place-items:center;
          font-family:"Saira Condensed",sans-serif; font-weight:700; font-size:13px; color:var(--ink-2)}
  .ph.now .ph-dot{background:var(--accent); color:var(--accent-ink); border-color:transparent}
  .ph.past .ph-dot{background:var(--ok-soft); color:var(--ok); border-color:transparent}
  .ph-t{flex:1 1 auto}
  .ph-t b{font-size:14.5px; display:block}
  .ph-t small{font-size:12px; color:var(--ink-2); display:block; margin-top:1px}
  .chip{display:inline-block; font-size:11px; font-weight:600; padding:2px 7px; border-radius:99px;
        margin-top:5px; margin-right:4px}
  .chip.test{background:var(--warn-soft); color:var(--warn)}
  .chip.now{background:var(--accent-soft); color:var(--accent)}

  /* formulario de cuenta */
  .campo{display:flex; flex-direction:column; gap:5px; margin-bottom:10px}
  .campo label{font-size:12px; color:var(--ink-2); font-weight:500}
  .campo input{padding:11px 12px; border-radius:11px; border:1px solid var(--line-2);
               background:var(--surface-2); font-size:16px; width:100%}
  .campo input::placeholder{color:var(--ink-3)}

  /* guia de pasos */
  .guia{list-style:none; counter-reset:paso; margin:0; padding:0; display:flex;
        flex-direction:column; gap:13px}
  .guia li{counter-increment:paso; display:grid; grid-template-columns:27px 1fr; gap:11px;
           align-items:start}
  .guia li::before{content:counter(paso); grid-row:span 2; width:27px; height:27px; border-radius:9px;
                   background:var(--accent-soft); color:var(--accent); display:grid; place-items:center;
                   font-family:"Saira Condensed",sans-serif; font-weight:700; font-size:14px}
  .guia li b{font-size:14.5px; line-height:1.25}
  .guia li span{grid-column:2; font-size:13px; color:var(--ink-2); line-height:1.45; margin-top:2px}

  /* chispa de evolucion */
  .spark{color:var(--accent); flex:0 0 auto; overflow:visible}

  /* progreso de la sesion */
  .prog{display:flex; align-items:center; gap:8px; margin-top:9px}
  .prog-t{flex:1 1 auto; height:6px; border-radius:99px; background:var(--line); overflow:hidden}
  .prog-t i{display:block; height:100%; background:var(--ok); border-radius:99px;
            transition:width .25s ease}
  .prog span{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-2);
             font-variant-numeric:tabular-nums}

  .caja{width:100%; min-height:120px; margin-top:8px; padding:9px; border-radius:10px;
        border:1px solid var(--line-2); background:var(--surface-2); color:var(--ink);
        font-size:11.5px; line-height:1.5; resize:vertical}
  .avat{width:40px; height:40px; border-radius:50%; flex:0 0 auto; background:var(--surface-2);
        border:1px solid var(--line); object-fit:cover}
  .usar{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:12px;
        padding-top:11px; border-top:1px solid var(--line)}
  .usar > span{font-size:12px; color:var(--ink-2); width:100%}
  .usar .btn{font-size:12.5px; padding:6px 10px}

  /* evolución de marcas */
  .evo{padding:11px 0}
  .evo + .evo{border-top:1px solid var(--line)}
  .evo-h{display:flex; align-items:baseline; gap:8px}
  .evo-h b{font-size:14.5px; flex:1 1 auto}
  .evo-kg{font-size:15px; font-weight:600}
  .chip.up{background:var(--ok-soft); color:var(--ok); margin:0}
  .chip.down{background:var(--warn-soft); color:var(--warn); margin:0}
  .evo-l{display:flex; gap:6px; margin-top:8px; overflow-x:auto; padding-bottom:2px}
  .mk{flex:0 0 auto; background:var(--surface-2); border:1px solid var(--line); border-radius:9px;
      padding:5px 8px; display:flex; flex-direction:column; min-width:72px}
  .mk b{font-size:13.5px; font-weight:600}
  .mk small{font-size:10px; color:var(--ink-3); white-space:nowrap}
  .conv-rm{display:flex; align-items:baseline; justify-content:space-between; gap:10px;
           background:var(--accent-soft); color:var(--accent); border-radius:10px;
           padding:9px 12px; margin-bottom:10px}
  .conv-rm span{font-family:"Saira Condensed",sans-serif; font-size:12px; letter-spacing:.12em;
                text-transform:uppercase; font-weight:600}
  .conv-rm b{font-size:21px; font-weight:600}

  .seg{display:flex; gap:6px; background:var(--surface-2); padding:4px; border-radius:12px;
       border:1px solid var(--line)}
  .seg button{flex:1 1 0; padding:8px 6px; border-radius:9px; font-size:13px; font-weight:600; color:var(--ink-2)}
  .seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}

  .banner{background:var(--deload-soft); color:var(--deload); border-radius:11px; padding:10px 12px;
          font-size:12.5px; line-height:1.4; display:flex; gap:9px; align-items:flex-start}
  .foot{margin-top:22px; font-size:11.5px; color:var(--ink-3); line-height:1.5}
  @media (prefers-reduced-motion: reduce){*{transition:none !important; animation:none !important}}
</style>

</head>
<body>
<div id="app">
  <header class="top">
    <div class="top-row">
      <div class="brand">Cuaderno<span>.</span></div>
      <div class="where mono" id="where">cargando</div>
    </div>
    <div class="bar" id="bar"></div>
  </header>
  <main id="view"></main>
  <p class="foot" id="foot"></p>
</div>

<div class="timer" id="timer" hidden>
  <div class="timer-in">
    <div class="t-num mono" id="tnum">0:00</div>
    <div class="t-lab"><b id="tlab">Descanso</b><span id="tsub"></span>
      <div class="t-track"><i id="ttrack" style="width:100%"></i></div>
    </div>
    <button class="t-btn" id="tplus" aria-label="Añadir 30 segundos">+30</button>
    <button class="t-btn stop" id="tstop" aria-label="Parar el cronómetro">■</button>
  </div>
</div>

<nav class="tabs"><div class="tabs-in" id="tabs" role="tablist"></div></nav>

<script>
(function(){
"use strict";

/* ============================ EL PLAN ============================ */
/* Coeficientes, repeticiones y descansos salen del cuaderno manuscrito
   del 31 de mayo de 2025 y de las tablas de rutina por microciclo.     */

var VERSION = "27 de septiembre de 2026";
var BARRA = 20;
var DISCOS = [25, 20, 15, 10, 5, 2.5, 1.25];
var PCOL = {25:"--p25", 20:"--p20", 15:"--p15", 10:"--p10", 5:"--p5", 2.5:"--p2", 1.25:"--p1"};

var LIFTS = [
  {k:"sentadilla", n:"Sentadilla", s:"Squat y box squat", ej:140},
  {k:"banca",      n:"Press banca", s:"Banca plana", ej:100},
  {k:"muerto",     n:"Peso muerto", s:"Convencional", ej:180},

/* La nube solo entra en juego en la web: dentro del visor de Claude manda su

function nubeInit(){
  var c = window.CUADERNO_SUPABASE;
  if(window.claude || !window.supabase) return;
  if(!c || !c.url || !c.anonKey) return;
  try{ nube = window.supabase.createClient(c.url, c.anonKey); }
  catch(e){ nube = null; return; }
  nube.auth.getSession().then(function(r){
    aplicaSesion(r && r.data ? r.data.session : null);
  })["catch"](function(){ render(); });
  nube.auth.onAuthStateChange(function(ev, ses){ aplicaSesion(ses); });
}
function aplicaSesion(ses){
  sesionNube = ses || null;
  if(sesionNube && sesionNube.user){
    cuenta.sync = "nube";
    cuenta.nombre = sesionNube.user.email || "";
    cargaNube();
  }else{
    cuenta.sync = "local"; cuenta.nombre = "";

function cargaNube(){
  if(!nube || !sesionNube) return;
  nube.from("entrenamientos").select("estado").eq("user_id", sesionNube.user.id).maybeSingle()
    .then(function(r){
      if(r.error){ avisoCuenta("No se han podido leer tus datos. " + r.error.message); render(); return; }
      var o = r.data && r.data.estado;
      if(o && o.v === 1 && (o.ts || 0) > (state.ts || 0)){
        state = merge(state, o);
        try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){}
      }else if(!o){
        guardaNube();
      }
      render();
    })["catch"](function(){ render(); });
}
function guardaNube(){
  if(!nube || !sesionNube) return;
  nube.from("entrenamientos").upsert({
    user_id: sesionNube.user.id,
    estado: JSON.parse(JSON.stringify(state)),
    actualizado: new Date().toISOString()
  }).then(function(r){
    if(r.error) avisoCuenta("No se ha podido guardar en tu cuenta. " + r.error.message);

}

function traduceError(m){

/* ============================ MOTOR DEL PLAN ============================ */
function hoy(){ return new Date().toLocaleDateString("es-ES", {day:"2-digit", month:"short", year:"2-digit"}); }

/* guarda una foto del maximal con la fecha y el ciclo en el que estabas */
function registra(k, kg, motivo, f){
  if(!(kg > 0)) return false;
  f = f || fase(state.pos.f);
  state.marcas = state.marcas || [];
  var ult = null, i;
  for(i = state.marcas.length - 1; i >= 0; i--){ if(state.marcas[i].k === k){ ult = state.marcas[i]; break; } }
  if(ult && ult.kg === kg && ult.f === f.id) return false;
  state.marcas.push({k:k, kg:kg, d:hoy(), f:f.id, fn:f.n, m:motivo || "test"});
  if(state.marcas.length > 400) state.marcas = state.marcas.slice(-400);
  return true;
}
function fotoDelCiclo(f, motivo){
  LIFTS.forEach(function(l){ registra(l.k, state.rms[l.k], motivo, f); });
}

function fase(i){ return FASES[Math.min(i, FASES.length - 1)]; }
function porSemana(f){ return state.porSemana[f.rut] || (f.rut === "AB" ? 4 : 3); }
function letra(f, e){ var L = RUT[f.rut].letras; return L[e % L.length]; }
function esDescarga(p){ var f = fase(p.f); return f.tipo !== "fuerza" && p.s === f.sem - 1; }
function micro(p){ return Math.min(p.s, 2); }

function avanzar(p){
  var f = fase(p.f), e = p.e + 1, s = p.s, i = p.f;
  if(e >= porSemana(f)){ e = 0; s++; }
  if(s >= f.sem){ s = 0; i++; }
  if(i >= FASES.length){ i = 0; s = 0; e = 0; }   /* el macrociclo se reinicia */
  return {f:i, s:s, e:e};
}
function sesionesRestantesFase(p){
  var f = fase(p.f), pw = porSemana(f);
  return (f.sem - p.s) * pw - p.e;
}
function totalSesiones(){
  var t = 0; FASES.forEach(function(f){ t += f.sem * porSemana(f); }); return t;
}
function sesionesHechas(p){
  var t = 0;
  for(var i = 0; i < p.f; i++) t += FASES[i].sem * porSemana(FASES[i]);
  t += p.s * porSemana(fase(p.f)) + p.e;
  return t;
}
function semanasA(p, destinoIdx){
  var pw, n = 0;
  for(var i = p.f; i < destinoIdx; i++){ n += FASES[i].sem; }
  n -= p.s;
  return n;
}
function proximoTest(p){
  for(var i = p.f; i < FASES.length; i++){
    if(FASES[i].test && !state.tests[FASES[i].id]) return i;
  }
  return -1;
}
function tocaTest(p){
  var f = fase(p.f);
  return !!(f.test && !state.tests[f.id] && p.s === 0 && p.e === 0);
}
function semanaPico(p){
  return fase(p.f).tipo === "fuerza" && p.s === FUERZA_SEM.length - 1;
}

/* ============================ CÁLCULO DE CARGA ============================ */
function redondea(kg){ return Math.round(kg / 2.5) * 2.5; }
/* Conversión Maurice y Rydin: cada repetición vale un 3% del peso.
   Es la tabla del convertidor, factor = 1 + 0,03 x (reps actuales - reps objetivo). */
function mrFactor(act, obj){ return 1 + 0.03 * (act - obj); }
function rmDesde(peso, reps){ return peso * mrFactor(reps, 1); }
function pesoPara(rm, reps){ return rm / mrFactor(reps, 1); }

function seriesDe(p, e){
  var f = fase(p.f), m = micro(p), tipo = e.t === "b" ? "b" : (e.js ? "js" : "c");
  if(f.tipo === "fuerza") return e.t === "b" ? 4 : (e.js ? 3 : 2);
  if(f.tipo === "final") return 4;
  if(e.fijo) return e.fijo.series;
  return SERIES[tipo][m];
}
function repsDe(p, e){
  var f = fase(p.f), n = seriesDe(p, e);
  if(e.fijo) return rep(e.fijo.reps, n);
  if(f.tipo === "fuerza") return e.t === "b" ? rep(FUERZA_SEM[Math.min(p.s, 6)].reps, n) : rep(8, n);
  if(f.tipo === "final") return e.t === "b" ? rep(8, n) : rep(12, n);
  if(e.t === "b"){
    var r = f.reps.slice(0, n);
    while(r.length < n) r.push(r[r.length - 1]);
    return r;
  }
  return e.js ? rep(15, n) : rep(10, n);
}
function rep(v, n){ var a = []; for(var i = 0; i < n; i++) a.push(v); return a; }

function coefSerie(p, e, i, n){
  var f = fase(p.f);
  if(e.fijo) return e.fijo.coef;
  if(f.tipo === "fuerza") return FUERZA_SEM[Math.min(p.s, 6)].coef;
  if(f.tipo === "final") return 0.82;
  var c = f.coef;
  if(c.length === 1) return c[0];
  var lad = f.reps || [], idx = i, m = n;
  if(lad.length){ idx = Math.min(i, lad.length - 1); m = lad.length; }
  if(m <= 1) return c[1];
  return c[0] + (c[1] - c[0]) * (idx / (m - 1));
}
function cargas(p, e){
  var n = seriesDe(p, e), reps = repsDe(p, e), out = [];
  for(var i = 0; i < n; i++){
    var kg = null;
    if(e.rm && state.rms[e.rm]) kg = redondea(state.rms[e.rm] * coefSerie(p, e, i, n));
    out.push({reps:reps[i], kg:kg});
  }
  return out;
}
function descansoDe(p, e){
  var f = fase(p.f);
  if(e.js) return 30;
  if(e.t === "b") return f.desc;
  return 120;
}
function discos(kg, bw){
  if(bw || !kg || kg <= BARRA) return null;
  var lado = (kg - BARRA) / 2, out = [];
  DISCOS.forEach(function(d){
    while(lado >= d - 0.01){ out.push(d); lado -= d; }
  });
  if(lado > 0.01) return null;
  return out;
}

var view = document.getElementById("view");
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function nf(n){ return (Math.round(n * 10) / 10).toString().replace(".", ","); }
/* Coeficientes y discos pequeños necesitan dos decimales: con uno solo,
   0,58 se convierte en 0,6 y un disco de 1,25 en 1,3. */
function nf2(n){
  var t = (Math.round(n * 100) / 100).toFixed(2).replace(/\.?0+$/, "");
  return (t || "0").replace(".", ",");
}
function mmss(s){ var m = Math.floor(Math.abs(s) / 60), r = Math.abs(s) % 60;
  return (s < 0 ? "-" : "") + m + ":" + (r < 10 ? "0" : "") + r; }

function avisos(p){
  var f = fase(p.f), h = "";
  if(tocaTest(p)){
    h += '<div class="flag test"><div class="ic">1RM</div><div><h3>Toca test de maximales</h3>' +
      '<p>' + esc(f.test) + '. Todos los pesos de ' + esc(f.n.toLowerCase()) +
      ' salen de estas marcas, así que hazlo antes de la primera sesión.</p>' +
      '<button class="act" data-go="rm"><span>Ir al test</span></button></div></div>';
  }
  if(semanaPico(p)){
    h += '<div class="flag test"><div class="ic">95</div><div><h3>Semana pico, 95% a 1 repetición</h3>' +
      '<p>Esta semana vale como test. Si la levantas limpia, sube al 100% y actualiza el maximal.</p>' +
      '<button class="act" data-go="rm"><span>Registrar marca</span></button></div></div>';
  }
  if(esDescarga(p) && f.tipo !== "fuerza"){
    h += '<div class="flag deload"><div class="ic">↓</div><div><h3>Semana de descarga</h3>' +
      '<p>Menos series, mismo peso y técnica limpia. Es la semana que te deja cerrar el ciclo entero.</p></div></div>';
  }
  var r = sesionesRestantesFase(p);
  if(!tocaTest(p) && r <= 3){
    var sig = fase(p.f + 1 < FASES.length ? p.f + 1 : 0);
    h += '<div class="flag info"><div class="ic">' + r + '</div><div><h3>' +
      (r === 1 ? "Última sesión de " : r + " sesiones para cerrar ") + esc(f.n.toLowerCase()) + '</h3>' +
      '<p>Después entras en el ' + esc(sig.n.toLowerCase()) + ', ' + esc(sig.nota) +
      (sig.test ? ', con test de maximales antes' : '') + '.</p></div></div>';
  }
  return h;
}

function hechosSesion(p, lista){
  var n = 0;
  lista.forEach(function(e, i){
    var tot = seriesDe(p, e), c = (sesion.sets || {})[i] || [], k = 0;
    for(var j = 0; j < tot; j++) if(c[j]) k++;
    if(tot && k >= tot) n++;
  });
  return n;
}

function vHoy(){
  var p = state.pos, f = fase(p.f), L = letra(f, p.e), lista = RUT[f.rut][L];
  var clave = p.f + "-" + p.s + "-" + p.e;
  if(sesion.k !== clave || !sesion.sets){ sesion = {k:clave, sets:{}}; saveSesion(); }

  var h = avisos(p);

       '<div class="letter' + (f.tipo === "fuerza" ? " f" : "") + '">' + L + '</div><div>' +

       '</div></div>';

  if(f.tipo === "fuerza"){
    var w = FUERZA_SEM[Math.min(p.s, 6)];
    h += '<div class="banner" style="margin-top:10px"><b>' + w.int + '</b><span>Coeficiente ' +
      nf(w.coef) + ', ' + w.reps + ' repeticiones por serie, 4 series. ' +
      'Calienta subiendo de 5 en 5 kg.</span></div>';
  }
  if(state.ejemplo){
    h += '<div class="banner" style="margin-top:10px"><b>Ejemplo</b><span>Los pesos salen de maximales de ejemplo. ' +
      'Mete los tuyos en la pestaña 1RM y todo se recalcula.</span></div>';
  }
  h += '</div>';

  h += '<div class="sect"><div class="eyebrow">La sesión</div>';
  lista.forEach(function(e, i){
    var c = cargas(p, e), sets = sesion.sets[i] || [], hechos = sets.filter(Boolean).length;
    var done = hechos > 0 && hechos >= c.length;
    var tag = e.t === "b" ? '<span class="tag b">básico</span>' :
             (e.js ? '<span class="tag js">jump set</span>' : '<span class="tag">compl</span>');
    var kg = c[0].kg, manual = state.pesos[e.n];
    var carga = kg ? nf(kg) + (c[c.length - 1].kg !== kg ? " a " + nf(c[c.length - 1].kg) : "") + " kg"
                   : (manual ? nf(manual) + " kg" : "a tu peso");
    if(e.bw && kg) carga = "+" + nf(Math.max(0, kg - 75)) + " kg";
    h += '<div class="ex' + (done ? " done" : "") + '" data-ex="' + i + '">' +
      '<button class="ex-head" data-open="' + i + '">' + tag +
      '<span class="ex-name">' + esc(e.n) + '</span>' +
      '<span class="ex-load"><b>' + esc(carga) + '</b><small>' + c.length + ' x ' +
      c.map(function(x){ return x.reps; }).join("-") + '</small></span></button>' +
      '<div class="ex-body"' + (done ? " hidden" : "") + '>' +
      '<div class="sets">';
    c.forEach(function(x, j){

function chispa(vals, w, h){
  if(vals.length < 2) return "";
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  var r = (max - min) || 1, pad = 5, pts = [];
  vals.forEach(function(y, i){
    pts.push([pad + i * (w - pad * 2) / (vals.length - 1),
              h - pad - (y - min) / r * (h - pad * 2)]);
  });
  var d = pts.map(function(q, i){ return (i ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1); }).join(" ");
  var u = pts[pts.length - 1];
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h +
    '" aria-hidden="true" focusable="false">' +
    '<path d="' + d + '" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round"/>' +
    '<circle cx="' + u[0].toFixed(1) + '" cy="' + u[1].toFixed(1) + '" r="4" fill="currentColor"/></svg>';
}

      'un maximal o cierres un ciclo se guarda una foto, con su fecha y su ciclo.</p></div></div>';
  }

    h += '<div class="evo"><div class="evo-h"><b>' + esc(l.n) + '</b>' +
      chispa(ms.map(function(x){ return x.kg; }), 62, 26) +

        (d >= 0 ? "+" : "") + nf(d) + ' kg</span>' : '') + '</div>';

          esc(x.fn.replace("Bloque de fuerza", "Fuerza")) + ', ' + esc(x.d) + '</small></span>';
      });
      h += '</div>';
    }
    h += '</div>';
  });

    }).join("") + '</div>' +
    '<p class="note">También arranca solo al marcar una serie, con el descanso que toque a ese ejercicio.</p></div></div>';

  h += '<p class="foot">Los coeficientes, las repeticiones y los descansos salen del cuaderno manuscrito ' +
    'del 31 de mayo de 2025 y de las tablas por microciclo. Dos cosas no están en el papel y son una ' +
    'lectura razonable del plan: el reparto del coeficiente entre las series de una pirámide, y en qué ' +
    'puntos toca el test de maximales.</p>';

}

/* ============================ DESCARGAS ============================ */
function codigo(){
  try{ return btoa(unescape(encodeURIComponent(JSON.stringify(state)))); }catch(e){ return ""; }
}
function restaura(txt){
  var o;
  try{ o = JSON.parse(decodeURIComponent(escape(atob(String(txt).trim())))); }
  catch(e){ return "Ese código no vale. Cópialo entero, sin espacios ni saltos de línea."; }
  if(!o || o.v !== 1) return "Ese código no es de esta app.";
  if(!window.confirm("Vas a sustituir el entrenamiento de este dispositivo por el del código. Lo de aquí se pierde.")) return "";
  state = merge(state, o);
  state.ts = Date.now();
  try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){}
  save(); render();
  return "Listo, entrenamiento restaurado.";
}

function csvMarcas(){
  var l = ['"ejercicio";"peso_kg";"fecha";"ciclo";"motivo"'];
  (state.marcas || []).forEach(function(m){
    var li = LIFTS.filter(function(x){ return x.k === m.k; })[0];
    l.push(['"' + (li ? li.n : m.k) + '"', '"' + nf(m.kg) + '"', '"' + m.d + '"',
            '"' + (m.fn || "") + '"', '"' + (m.m || "") + '"'].join(";"));
  });
  return l.join("\r\n");
}
function csvSesiones(){
  var l = ['"fecha";"ciclo";"semana";"entreno"'];
  (state.hechas || []).forEach(function(x){
    l.push(['"' + x.d + '"', '"' + x.f + '"', '"' + x.w + '"', '"' + x.r + '"'].join(";"));
  });
  return l.join("\r\n");
}
function estado(txt){
  var e = document.getElementById("dl-estado");
  if(e) e.textContent = txt;
}
/* fuera del visor de claude.ai no hay capacidad de descarga: se guarda a la vieja usanza */
function guardaSuelto(nombre, texto){
  try{
    var b = new Blob(["﻿" + texto], {type:"text/csv;charset=utf-8"});
    var u = URL.createObjectURL(b), a = document.createElement("a");
    a.href = u; a.download = nombre; a.style.display = "none";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); }, 1000);
    return true;
  }catch(e){ return false; }
}
function enCaja(texto){
  var c = document.getElementById("dl-caja");
  if(!c){ estado("No se ha podido preparar el archivo."); return; }
  c.hidden = false; c.value = texto;
  c.focus(); c.select();
  estado("Selecciona todo el recuadro, cópialo y pégalo en Excel.");
}
function alPortapapeles(texto){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(texto).then(function(){
        estado("Copiado. Pégalo en Excel y guárdalo como CSV.");
      })["catch"](function(){ enCaja(texto); });
      return;
    }
  }catch(e){}
  enCaja(texto);
}
function descarga(nombre, texto, vacio){
  var caja = document.getElementById("dl-caja");
  if(caja) caja.hidden = true;
  if(vacio){ estado("Todavía no hay nada que exportar."); return; }
  if(dl){
    estado("Preparando el archivo.");
    dl.save({filename:nombre, data:"\ufeff" + texto}).then(function(){
      estado("Archivo guardado.");
    })["catch"](function(e){
      var c = e && e.code;
      if(c === "declined"){ estado("Descarga cancelada."); return; }
      if(c === "rate_limited"){ estado("Espera un momento y vuelve a darle."); return; }
      estado("No se ha podido guardar. Te lo copio al portapapeles.");
      alPortapapeles(texto);
    });
    return;
  }
  /* sin la capacidad de descarga: fuera del visor vale el método clásico,
     dentro el navegador lo bloquea, así que va al portapapeles */
  if(!(window.claude && window.claude.use)){
    estado(guardaSuelto(nombre, texto) ? "Archivo guardado." : "No se ha podido guardar el archivo.");
    return;
  }
  alPortapapeles(texto);
}

/* ============================ CRONÓMETRO ============================ */
var T = {fin:0, total:0, lab:"", sub:"", int:null, wake:null, son:false};
var actx = null;

function beep(){
  try{
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.18, 0.36].forEach(function(t){
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = "square"; o.frequency.value = t === 0.36 ? 1320 : 880;
      g.gain.setValueAtTime(0.0001, actx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.16, actx.currentTime + t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + t + 0.14);
      o.connect(g); g.connect(actx.destination);
      o.start(actx.currentTime + t); o.stop(actx.currentTime + t + 0.16);
    });
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([120, 70, 120]); }catch(e){}
}
function startTimer(seg, lab, sub){
  T.fin = Date.now() + seg * 1000; T.total = seg; T.lab = lab || "Descanso"; T.sub = sub || ""; T.son = false;
  document.getElementById("timer").hidden = false;
  document.getElementById("tlab").textContent = T.lab;
  document.getElementById("tsub").textContent = T.sub;
  if(!actx){ try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state === "suspended") actx.resume();
  try{
    if(navigator.wakeLock && !T.wake)
      navigator.wakeLock.request("screen").then(function(w){ T.wake = w; })["catch"](function(){});
  }catch(e){}
  clearInterval(T.int); T.int = setInterval(tick, 200); tick();
}
function stopTimer(){
  clearInterval(T.int); T.int = null;
  document.getElementById("timer").hidden = true;
  document.getElementById("timer").classList.remove("late");
  try{ if(T.wake){ T.wake.release(); T.wake = null; } }catch(e){}
}
function tick(){
  var q = Math.round((T.fin - Date.now()) / 1000);
  document.getElementById("tnum").textContent = mmss(q);
  document.getElementById("ttrack").style.width =
    Math.max(0, Math.min(100, q / T.total * 100)) + "%";
  if(q <= 0 && !T.son){ T.son = true; beep(); document.getElementById("timer").classList.add("late"); }
  if(q < -600) stopTimer();
}

/* ============================ EVENTOS ============================ */
document.getElementById("tstop").addEventListener("click", stopTimer);
document.getElementById("tplus").addEventListener("click", function(){
  T.fin += 30000; T.total += 30;
  document.getElementById("timer").classList.remove("late"); T.son = false; tick();
});

document.addEventListener("click", function(ev){
  var el;
  if((el = ev.target.closest("[data-set]"))){
    var a = el.dataset.set.split(","), i = +a[0], j = +a[1];
    var p = state.pos, f = fase(p.f), e = RUT[f.rut][letra(f, p.e)][i];
    sesion.sets[i] = sesion.sets[i] || [];
    sesion.sets[i][j] = !sesion.sets[i][j];
    saveSesion();
    if(sesion.sets[i][j]){
      var c = cargas(p, e), q = c.filter(function(x, k){ return !sesion.sets[i][k]; }).length;
      startTimer(descansoDe(p, e), e.n,
        q > 0 ? "Quedan " + q + " serie" + (q > 1 ? "s" : "") : "Ejercicio terminado");
    }
    render(); return;
  }
  if((el = ev.target.closest("[data-open]"))){
    var bd = el.parentElement.querySelector(".ex-body");
    bd.hidden = !bd.hidden; return;
  }
  if((el = ev.target.closest("[data-go]"))){ tab = el.dataset.go; render(); return; }
  if((el = ev.target.closest("[data-usar]"))){
    var uk = el.dataset.usar, ukg = parseFloat(el.dataset.kg);
    if(ukg > 0){
      state.rms[uk] = ukg; state.rmsFecha[uk] = hoy(); state.ejemplo = false;
      registra(uk, ukg, "estimado desde una serie");
      var uf = fase(state.pos.f);
      if(uf.test) state.tests[uf.id] = true;
      save(); render();
    }
    return;
  }
  if((el = ev.target.closest("[data-timer]"))){ startTimer(+el.dataset.timer, "Descanso", ""); return; }
  if((el = ev.target.closest(".tab"))){ tab = el.dataset.t; render(); return; }
  if((el = ev.target.closest("[data-seg] button"))){
    var seg = el.closest("[data-seg]").dataset.seg;
    state.porSemana[seg] = +el.dataset.v; state.pos.e = 0; save(); render(); return;
  }
  if(ev.target.id === "cerrar"){
    var p2 = state.pos, f2 = fase(p2.f);
    state.hechas.push({d:new Date().toLocaleDateString("es-ES", {day:"2-digit", month:"short"}),
                       f:f2.n, w:p2.s + 1, r:letra(f2, p2.e)});
    if(state.hechas.length > 300) state.hechas = state.hechas.slice(-300);
    var sig = avanzar(p2);
    if(sig.f !== p2.f && !state.ejemplo) fotoDelCiclo(f2, "cierre de ciclo");
    state.pos = sig;
    sesion = {}; saveSesion(); save(); stopTimer(); render();
    window.scrollTo({top:0, behavior:"smooth"}); return;
  }
  if(ev.target.id === "au-entrar" || ev.target.id === "au-crear"){
    var crear = ev.target.id === "au-crear";
    var mail = (document.getElementById("au-mail") || {}).value || "";
    var pass = (document.getElementById("au-pass") || {}).value || "";
    if(!mail.trim() || !pass){ avisoCuenta("Rellena el correo y la contraseña."); return; }
    avisoCuenta(crear ? "Creando la cuenta." : "Entrando.");
    var cred = {email:mail.trim(), password:pass};
    var pr = crear ? nube.auth.signUp(cred) : nube.auth.signInWithPassword(cred);
    pr.then(function(r){
      if(r.error){ avisoCuenta(traduceError(r.error.message)); return; }
      if(crear && r.data && r.data.user && !r.data.session){
        avisoCuenta("Cuenta creada. Te hemos mandado un correo: confírmalo y vuelve a entrar.");
        return;
      }
      avisoCuenta("");
    })["catch"](function(e){ avisoCuenta(traduceError(e && e.message)); });
    return;
  }
  if(ev.target.id === "au-salir"){
    avisoCuenta("Cerrando sesión.");
    nube.auth.signOut().then(function(){ avisoCuenta(""); })["catch"](function(){});
    return;
  }
  if(ev.target.id === "cod-sacar"){
    var c = codigo(), caja = document.getElementById("cod-caja");
    document.getElementById("cod-ok").hidden = true;
    if(!c){ document.getElementById("cod-estado").textContent = "No se ha podido generar el código."; return; }
    caja.hidden = false; caja.readOnly = true; caja.value = c; caja.focus(); caja.select();
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(c).then(function(){
          document.getElementById("cod-estado").textContent = "Código copiado. Pégalo en el otro dispositivo.";
        })["catch"](function(){
          document.getElementById("cod-estado").textContent = "Selecciona el recuadro y cópialo a mano.";
        });
        return;
      }
    }catch(e){}
    document.getElementById("cod-estado").textContent = "Selecciona el recuadro y cópialo a mano.";
    return;
  }
  if(ev.target.id === "cod-meter"){
    var cj = document.getElementById("cod-caja");
    cj.hidden = false; cj.readOnly = false; cj.value = ""; cj.focus();
    document.getElementById("cod-ok").hidden = false;
    document.getElementById("cod-estado").textContent = "Pega el código del otro dispositivo y dale a Restaurar.";
    return;
  }
  if(ev.target.id === "cod-ok"){
    var msg = restaura(document.getElementById("cod-caja").value);
    var e2 = document.getElementById("cod-estado");
    if(e2 && msg) e2.textContent = msg;
    return;
  }
  if(ev.target.id === "dl-marcas"){
    descarga("progresion-maximales.csv", csvMarcas(), !(state.marcas || []).length); return;
  }
  if(ev.target.id === "dl-ses"){
    descarga("sesiones.csv", csvSesiones(), !(state.hechas || []).length); return;
  }
  if(ev.target.id === "reset-sets"){ sesion.sets = {}; saveSesion(); render(); return; }
  if(ev.target.id === "atras"){
    var p3 = state.pos;
    if(p3.e > 0) p3.e--;
    else if(p3.s > 0){ p3.s--; p3.e = porSemana(fase(p3.f)) - 1; }
    else if(p3.f > 0){ p3.f--; p3.s = fase(p3.f).sem - 1; p3.e = porSemana(fase(p3.f)) - 1; }
    sesion = {}; saveSesion(); save(); render(); return;
  }
  if(ev.target.id === "test-ok"){
    state.tests[fase(state.pos.f).id] = true; save(); render(); return;
  }
});

/* ============================ ARRANQUE ============================ */
loadLocal();

function adopta(o){
  if(!o || o.v !== 1) return false;
  state = merge(state, o);
  try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){}
  return true;
}
function escucha(){
  var r = docRef();
  if(!r || subs) return;
  subs = r.onSnapshot(function(snap){
    if(!snap.exists) return;
    var o = snap.data();
    if(o && o.v === 1 && (o.ts || 0) > (state.ts || 0)){ adopta(o); render(); }
  }, function(){});
}
function arranca(){
  if(!db){ cuenta.sync = "local"; render(); return; }
  cuenta.sync = uid ? "cuenta" : "artefacto";
  var r = docRef();
  r.get().then(function(snap){
    if(snap.exists){ if(adopta(snap.data())) render(); escucha(); return; }
    if(!uid){ escucha(); save(); return; }
    /* primera vez con identidad: recoge lo que hubiera en el documento común */
    return db.doc("plan/state").get().then(function(viejo){
      if(viejo.exists && adopta(viejo.data())) render();
      escucha(); save();
    });
  })["catch"](function(){ cuenta.sync = "local"; render(); });
}

    if(me){ uid = me.id || null; cuenta.nombre = me.name || ""; cuenta.avatar = me.avatarUrl || ""; }
